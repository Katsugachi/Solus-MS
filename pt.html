<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyTrack</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }

        #fullscreen-iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none; 
        }
    </style>
</head>
<body>

    <iframe id="fullscreen-iframe" src="https://katsugachi.github.io/polytrack/" allowfullscreen></iframe>

    <script>/* Solus MS Offline Mode: inert unless enabled in the launcher Settings. */try{if(localStorage.getItem('solus_offline')==='true'){var s=document.createElement('script');s.src=location.origin+location.pathname.replace(/[^/]*$/,'')+'offline.js';(document.head||document.documentElement).appendChild(s);}}catch(e){}</script>
</body>
</html>
